# Render Blueprint — 저장소 루트에 있어야 자동으로 읽힌다.
# 콘솔 백엔드(FastAPI)만 올린다. 프런트는 Vercel 에 있다.
services:
  - type: web
    name: byr-console-api
    runtime: python
    plan: free
    rootDir: console/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 콘솔 프런트 주소 — CORS 허용 목록(쉼표로 여러 개)
      - key: CORS_ORIGINS
        value: https://byr-console.vercel.app
      # 외부 커넥터(구글 시트·Jira)는 기본 꺼짐. 쓸 때만 값을 넣는다.
      - key: BYR_CONNECTORS_LIVE
        value: "0"
      # 네이버·카카오 소셜 로그인 — 값은 Render 대시보드에서 넣는다(sync: false = 저장소에 두지 않음)
      - key: BYR_PUBLIC_URL
        value: https://byr-console.vercel.app
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
